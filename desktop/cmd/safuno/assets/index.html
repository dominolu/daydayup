<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safuno 安诺</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f8fa; color: #1a2939; }
    main { width: min(520px, calc(100vw - 48px)); padding: 36px; border: 1px solid #e9edf1; border-radius: 14px; background: #fff; box-shadow: 0 8px 32px #17293b0d; }
    .mark { width: 46px; height: 46px; border-radius: 13px; background: #109486; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 22px; }
    h1 { font-size: 22px; margin: 18px 0 8px; letter-spacing: -.4px; }
    p { color: #7f8a99; font-size: 13px; line-height: 1.8; margin: 0 0 18px; }
    code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; background: #f1f5f7; border-radius: 4px; padding: 2px 5px; }
  </style>
</head>
<body>
<main>
  <div class="mark">D</div>
  <h1>Safuno 安诺网关</h1>
  <p>桌面壳已启动。管理台会加载网关自身的 <code>/admin/</code> 页面；如果窗口没有出现，请从菜单栏图标选择「打开管理台」。</p>
  <p>此页面是 Wails 的本地资源入口，仅用于启动诊断，不是管理台本身。</p>
</main>
</body>
</html>
